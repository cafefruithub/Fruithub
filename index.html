<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#1f2a22;--mut:#8a938c;--line:#ececE6;--lime:#7dc614;--limed:#5fa00a;--dk:#3a4a40;--dk2:#2c3a31;--gr:#1f4a33;--soft:#eaf0e6;--red:#c0392b;--warn:#d98a1c;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 Poppins,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:18px;padding:16px;min-height:100vh}
.side{background:var(--card);border-radius:30px;padding:22px 16px;position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 20px #0000000a}
.side img{width:110px;margin:0 auto 14px;display:block}
.side h6{font-size:15px;font-weight:500;margin:14px 8px 4px}
.side button{background:none;border:0;text-align:left;padding:11px 14px;border-radius:12px;cursor:pointer;color:var(--mut);display:flex;gap:12px;align-items:center;position:relative}
.side button.on{background:#f1f9e4;color:var(--limed);font-weight:500}
.side button.on:after{content:"";position:absolute;right:-16px;top:0;bottom:0;width:4px;background:var(--lime);border-radius:4px}
.side .sp{flex:1}.side small{color:var(--mut);padding:0 14px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb;display:inline-block}.dot.on{background:var(--lime)}.dot.err{background:var(--red)}
main{min-width:0;padding:8px 0 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
header h1{font-size:28px;font-weight:500}header p{color:var(--mut);font-size:13px}
.srch{background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:13px 16px;width:260px;box-shadow:0 2px 10px #0000000a}
.gear{display:none;background:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:18px}
.mob{display:none}
.banner{background:var(--lime);border-radius:30px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;box-shadow:0 14px 26px #7dc61433;margin-bottom:18px}
.bs{background:#5fa00a;color:#fff;border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-end}
.bs small{opacity:.9;display:block}.bs b{font-size:20px;font-weight:500}
.bs svg{width:90px;height:36px}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;margin-bottom:18px}
.card{background:var(--card);border-radius:26px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px #0000000a}
.cols .card{margin:0}
.card h2{font-size:17px;font-weight:500;margin-bottom:8px}
.hd{display:flex;justify-content:space-between;align-items:center}.hd a{font-size:12px;cursor:pointer;color:var(--mut)}
.leg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.chart svg,.dn svg{width:100%;display:block}
.tr{display:grid;grid-template-columns:44px 1.6fr 1.2fr 1fr 110px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tr:first-of-type{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--gr);display:grid;place-items:center;font-style:normal;font-weight:600}
.n small{display:block;color:var(--mut);font-size:12px}.dt{color:var(--mut);font-size:13px}.am{font-weight:500}
.pill{font-style:normal;font-size:12px;padding:4px 12px;border-radius:8px;text-align:center}
.pill.ok{background:#e6f4d4;color:var(--limed)}.pill.pd{background:#fdf0d5;color:var(--warn)}.pill.wr{background:#fde3dd;color:var(--red)}
.panel{background:var(--dk);border-radius:30px;color:#eef3ea;padding:20px;position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column;gap:14px}
.panel .cover{background:var(--lime);border-radius:20px;height:96px;position:relative;margin-bottom:34px}
.panel .cover img{position:absolute;left:50%;bottom:-36px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:3px solid var(--dk);background:#fbd08e;object-fit:cover}
.panel h3{text-align:center;font-weight:500;font-size:16px}.panel p{text-align:center;color:#b9c6b8;font-size:12px}
.dash{display:flex;gap:4px;justify-content:center}.dash i{width:20px;height:4px;border-radius:3px;background:#5b6b5f}.dash i.f{background:var(--lime)}
.ps{display:flex;justify-content:space-around;text-align:center}.ps b{display:block;font-weight:500}.ps small{color:#b9c6b8}
.earn{background:var(--dk2);border-radius:24px;padding:16px;text-align:center;margin-top:auto}
.earn .b{background:#27332b;border-radius:18px;padding:16px;margin:10px 0}.earn .b b{display:block;color:var(--lime);font-size:22px;font-weight:500}.earn .b small{color:var(--lime)}
.btn{background:var(--lime);color:#17310a;border:0;border-radius:14px;padding:11px 20px;cursor:pointer;font-weight:500}
.btn.g{background:var(--gr);color:#fff}.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:7px 12px;font-size:13px}.btn.full{width:100%;margin-top:16px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;background:var(--bg);border:1px solid transparent;border-radius:14px;padding:12px 14px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--lime)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:12px;cursor:pointer}.seg button.on{background:var(--gr);color:#fff}
.order{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.order h3{font-size:16px;font-weight:500}.order .m{color:var(--mut);font-size:12px}
.price{font-size:19px;font-weight:500;text-align:right}
.tag{display:inline-block;padding:2px 10px;border-radius:8px;font-size:12px;background:var(--soft);color:var(--gr);margin-right:4px}.tag.cod{background:#fdf0d5;color:var(--warn)}.tag.due{background:#fde3dd;color:var(--red)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}.sum b{display:block;font-size:14px;color:var(--ink);font-weight:500}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}
.modal .card{width:100%;max-width:440px;margin:0;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--dk);color:#fff;padding:12px 18px;border-radius:14px;display:none;z-index:30;max-width:90%}
.tabs,.hero,.acts,.bars{display:none}
@media(max-width:1180px){.app{grid-template-columns:200px minmax(0,1fr)}.panel{display:none}}
@media(max-width:800px){
.app{display:block;padding:14px 14px 120px}.side{display:none}main{padding:0}
.srch{display:none}.gear{display:block}.dsk,.banner,.chart,.cols .dn.d{display:none}.mob{display:block}
header h1{font-size:19px}header p{font-size:12px}
.cols{display:block}.cols .card{margin-bottom:14px}
.hero{display:block;background:var(--gr);color:#fff;border-radius:24px;padding:18px 20px;margin-bottom:16px}
.hero small{opacity:.8}.hero b{display:block;font-size:34px;font-weight:500;line-height:1.2}.hero span{background:#ffffff26;border-radius:10px;padding:3px 10px;font-size:12px;float:right;margin-top:-34px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;text-align:center;font-size:12px}
.acts button{background:#fff;border:0;border-radius:18px;padding:14px 4px;font-size:12px;box-shadow:0 2px 10px #0000000a}.acts span{display:block;font-size:20px;margin-bottom:2px}
.bars{display:block}
.tr{grid-template-columns:44px 1fr auto}.tr .dt,.tr .pill{display:none}.tr .am{text-align:right}
.tabs{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:28px;padding:8px 6px;z-index:10;justify-content:space-around;align-items:center;box-shadow:0 6px 28px #00000026}
.tabs button{background:none;border:0;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 8px;cursor:pointer}.tabs button.on{color:var(--gr);font-weight:600}.tabs span{font-size:19px}
.tabs button.mid{background:var(--gr);color:#fff;width:54px;height:54px;border-radius:50%;margin-top:-26px;font-size:26px;justify-content:center;box-shadow:0 6px 14px #1f4a3355;border:4px solid var(--bg)}
}

.toast{display:block;opacity:0;transform:translate(-50%,14px);pointer-events:none;transition:.35s cubic-bezier(.2,.7,.2,1)}.toast.on{opacity:1;transform:translate(-50%,0)}
.modal.show .card{animation:pop .35s cubic-bezier(.2,.7,.2,1)}
.btn{transition:transform .15s,filter .2s}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:scale(.96)}
.side button{transition:background .25s,color .25s,transform .25s}.side button:hover{transform:translateX(3px)}
.panel .cover img,.dot{transition:transform .4s}.panel .cover img:hover{transform:translateX(-50%) scale(1.08)}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes sweep{from{opacity:0;transform:rotate(-120deg) scale(.85)}}
@keyframes pulse{50%{opacity:.3}}
.anim>*{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
.anim>*:nth-child(2){animation-delay:.07s}.anim>*:nth-child(3){animation-delay:.14s}.anim>*:nth-child(4){animation-delay:.21s}.anim>*:nth-child(5){animation-delay:.28s}.anim>*:nth-child(6){animation-delay:.35s}
.anim .rw{animation:in .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms + .35s)}
.anim .ln{stroke-dasharray:1;animation:draw 1.4s .3s cubic-bezier(.2,.7,.2,1) both}
.anim .dn svg{animation:sweep 1s .2s cubic-bezier(.2,.7,.2,1) both}
.dot.busy{animation:pulse 1s infinite}
.panel,.side{animation:in .7s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.side button span,.tabs button span{display:flex;font-size:0}.tabs button.mid svg.i{width:26px;height:26px}.ic svg.i{width:18px;height:18px}
.hb{display:flex;gap:10px;align-items:center}
.hbtn{position:relative;background:var(--card);color:var(--ink);border:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px #0000000a;transition:transform .25s}.hbtn:hover{transform:scale(1.08)}
.hbtn.gear{display:none}
#bn{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-style:normal;display:none;place-items:center;padding:0 4px}
#bell.ring svg{transform-origin:50% 10%;animation:ring 1.2s 1s 2}
@keyframes ring{20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-5deg)}}
.rem{position:fixed;top:76px;right:20px;width:330px;max-width:calc(100vw - 24px);max-height:60vh;overflow:auto;background:var(--card);border-radius:22px;padding:16px;box-shadow:0 14px 44px #0003;display:none;z-index:25}
.rem.show{display:block;animation:pop .3s cubic-bezier(.2,.7,.2,1)}
.ri{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.ri small{color:var(--mut)}.ri span{grid-row:1/3;grid-column:2;align-self:center;color:var(--red);font-weight:500}
.note{position:fixed;top:16px;right:16px;max-width:350px;background:var(--dk2);color:#fff;padding:14px 16px;border-radius:20px;display:flex;gap:12px;align-items:flex-start;z-index:40;transform:translateX(120%);transition:transform .55s cubic-bezier(.2,.7,.2,1);cursor:pointer;box-shadow:0 14px 44px #0004}
.note.on{transform:none}.note.on svg{color:#ffcf5a;transform-origin:50% 10%;animation:ring 1.2s .6s 2}
.tag.ok{background:#e6f4d4;color:var(--limed)}.ba{margin-top:8px;display:flex;gap:6px;justify-content:flex-end}
#flt{margin-bottom:14px}
:root[data-theme=dark]{--bg:#0e1210;--card:#1a1f1c;--ink:#eef2ef;--mut:#8c958f;--line:#272e2a;--soft:#242b27;color-scheme:dark}

[data-theme=dark] .panel{background:#18211b}[data-theme=dark] .panel .cover img{border-color:#18211b}

function series(){const o=[];for(let i=6;i>=0;i--){const s=d0(Date.now()-i*864e5);

function path(v,W,H,px,py){const m=Math.max(...v,1),p=v.map((y,i)=>[px+i*(W-2*px)/(v.length-1),H-py-(y/m)*(H-2*py)]);

 <p id="c_left" style="margin-top:10px;font-weight:500"></p><p style="color:var(--mut);font-size:13px;margin-top:10px">Leave the paid amount empty if the customer has not paid. The order will move to the Not paid tab with the amount left.</p>
 <button class="btn g full" id="c_ok">Confirm and send report</button><button class="btn o full" id="c_no">Cancel</button>`;
 $("#modal").classList.add("show");
 $("#c_no").onclick=()=>$("#modal").classList.remove("show");
 const lf=()=>{const v=$("#c_p").value,e=$("#c_left");const d=o.price-(o.paid||0)-(+v||0);e.innerHTML=d>0?'Amount left to pay: <span style="color:var(--red)">'+lkr(d)+'</span>':d===0?"Fully paid":"Fully paid · extra "+lkr(-d)};$("#c_p").oninput=lf;const ct=$("#c_t");if(ct)ct.onchange=()=>{$("#c_p").value=ct.checked?Math.max(o.price-(o.paid||0),0):"";lf()};lf();
 $("#c_ok").onclick=()=>{const p=+$("#c_p").value||0,f=+$("#c_f").value||0;if(f<0||p<0)return toast("Enter valid amounts.");
  o.rider=D.riders[$("#c_r").value].name;o.fee=f;o.paid=(o.paid||0)+p;if(p>0)(o.pays=o.pays||[]).push({t:Date.now(),a:p});o.status=o.paid>=o.price?"done":"delivered";o.doneAt=Date.now();if(o.status==="done")o.paidAt=Date.now();
  const msg=`*Fruit Hub – Order delivered*\nDate: ${new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}\nClient: ${o.customer}${o.note?"\nAddress: "+o.note:""}\nOrder price: ${lkr(o.price)}\nPayment method: ${o.method==="COD"?"Cash on delivery":"Online transfer"}\nClient paid: ${lkr(o.paid)}${o.status==="delivered"?`\nAmount left: ${lkr(o.price-o.paid)}`:""}\nRider: ${o.rider}\nRider fee: ${lkr(o.fee)}`;
  $("#modal").classList.remove("show");save();
  window.open("https://wa.me/"+NOTIFY+"?text="+encodeURIComponent(msg),"_blank");
  tab=o.status==="done"?"done":"unpaid";F="all";render();toast(o.status==="done"?"Order completed":"Saved. Amount left "+lkr(o.price-o.paid))}}
/* GitHub Gist sync (token only) */
const H=()=>({Authorization:"Bearer "+CFG.token,Accept:"application/vnd.github+json"});
async function api(p,o){const r=await fetch("https://api.github.com"+p,Object.assign({headers:H(),cache:"no-store"},o));
 if(!r.ok)throw new Error(r.status===401?"GitHub did not accept that token. Tick the gist permission.":r.status===403||r.status===429?"GitHub is limiting requests. Try again in a minute.":r.status===404?"Cloud copy not found. Disconnect and connect again.":"GitHub error "+r.status);return r.json()}
function merge(a,b){const del=[...new Set([...(a.del||[]),...(b.del||[])])],m={};
 [...a.orders,...b.orders].forEach(o=>{if(del.includes(o.id))return;const x=m[o.id];if(!x||(o.doneAt||0)>(x.doneAt||0)||(o.paid||0)>(x.paid||0))m[o.id]=o});
 return{orders:Object.values(m),riders:(b.rev||0)>=(a.rev||0)?b.riders:a.riders,rev:Math.max(a.rev||0,b.rev||0),del}}
async function readG(){const g=await api("/gists/"+CFG.gist),f=g.files&&g.files[FN];let t=f?f.content:null;if(f&&f.truncated)t=await(await fetch(f.raw_url)).text();ver=g.history[0].version;return t?JSON.parse(t):null}
function take(rem){const m=merge(D,rem);if(JSON.stringify(m)!==JSON.stringify(D)){D=m;localStorage.setItem("fh_data",JSON.stringify(D));if(!document.querySelector("input:focus,select:focus")&&!$("#modal.show")&&tab!=="new")render()}}
async function find(){for(let p=1;p<=5;p++){const l=await api("/gists?per_page=100&page="+p),g=l.find(x=>x.description===GD&&x.files&&x.files[FN]);if(g)return g.id;if(l.length<100)break}return null}
async function connect(){busy=true;try{CFG.gist=await find();
 if(CFG.gist){const rem=await readG();if(rem)take(rem)}
 else{const g=await api("/gists",{method:"POST",body:JSON.stringify({description:GD,public:false,files:{[FN]:{content:JSON.stringify(D)}}})});CFG.gist=g.id;ver=g.history[0].version}
 CFG.err="";saveCfg();busy=false;dirty=true;await push()}
 catch(e){busy=false;CFG={token:CFG.token,err:e.message.replace("Cloud copy not found. Disconnect and connect again.","Could not find or create the gist.")};if(!CFG.gist){CFG={err:CFG.err}}}setNav()}
async function pull(){if(!CFG.gist||busy)return;busy=true;setNav();const v0=ver;
 try{const rem=await readG();if(rem&&ver!==v0)take(rem);CFG.err=""}catch(e){CFG.err=e.message}busy=false;setNav()}
async function push(){if(!CFG.gist||!dirty)return;if(busy)return setTimeout(push,800);busy=true;setNav();
 try{const rem=await readG();if(rem)take(rem);const g=await api("/gists/"+CFG.gist,{method:"PATCH",body:JSON.stringify({files:{[FN]:{content:JSON.stringify(D)}}})});ver=g.history[0].version;dirty=false;CFG.err=""}
 catch(e){CFG.err=e.message}busy=false;setNav()}
$("#modal").onclick=e=>{if(e.target.id==="modal")e.target.classList.remove("show")};
$("#q").oninput=render;$("#theme").onclick=()=>{DK=!DK;localStorage.setItem("fh_theme",DK?"dark":"light");applyTheme();render()};
$("#bell").onclick=e=>{e.stopPropagation();remList();$("#rem").classList.toggle("show")};
document.addEventListener("click",e=>{if(!e.target.closest("#rem"))$("#rem").classList.remove("show")});
$("#rem").onclick=e=>{if(e.target.closest("[data-go]")){tab="unpaid";$("#rem").classList.remove("show");render()}};
$("#note").onclick=()=>{tab="unpaid";$("#note").classList.remove("on");render()};
applyTheme();render();pull().then(notice);setInterval(bell,60000);setInterval(()=>{if(!dirty)pull()},15000);addEventListener("resize",setNav);

</script></body></html>
